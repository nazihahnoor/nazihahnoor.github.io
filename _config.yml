title: Nazihah Noor
tagline: Unbuilding Walls
description: >
  Nazihah Noor is a doctoral researcher looking into the social reproduction
  of health inequalities across the life course, with over 10 years of
  experience in public health, social and gender inequalities, and policy.
author: Nazihah Noor
email: nazihah.noor@proton.me

url: "https://nazihahnoor.github.io"
baseurl: ""

linkedin: "https://linkedin.com/in/nazihahnoor"
google_scholar: "https://scholar.google.com/citations?user=KUv8NX4AAAAJ&hl=en"
orcid: "https://orcid.org/0000-0001-6543-1352"
github_username: nazihahnoor

markdown: kramdown
permalink: /reflections/:year/:month/:slug/

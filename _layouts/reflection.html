---
layout: default
---
<article class="reflection">
  <header class="reflection-header">
    {% if page.category %}<p class="reflection-category">{{ page.category }}</p>{% endif %}
    <h1 class="reflection-title">{{ page.title }}</h1>
    <p class="reflection-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="reflection-footer">
    <a href="{{ '/reflections/' | relative_url }}" class="back-link">Back to Reflections</a>
  </footer>
</article>
